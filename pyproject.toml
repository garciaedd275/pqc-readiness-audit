[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pqc-readiness-audit"
version = "0.1.0"
description = "Post-Quantum Cryptography (PQC) readiness audit tool: scans TLS/certificate configurations, classifies quantum-vulnerable cryptography, prioritizes remediation, and generates audit-ready reports."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Eddie Garcia" }]
dependencies = [
    "sslyze>=6.0",
    "cryptography>=42.0",
    "click>=8.1",
    "jinja2>=3.1",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[project.scripts]
pqc-audit = "pqc_audit.cli:cli"

[tool.setuptools.packages.find]
include = ["pqc_audit*"]

[tool.setuptools.package-data]
pqc_audit = ["rules.yaml", "templates/*.md.j2", "templates/*.html.j2"]
